<style>
/* Layout: a fixed 1920x1080 stage scaled to fit the window (letterboxed), so it is always 16:9.
   Every photo and video is placed by script at its true shape inside a gold keyline, never stretched or blurred. */
:root{
  --letterbox:#000;
  --navy:#0e1824;
  --navy-2:#162435;
  --gold:#c9ab6e;
  --gold-soft:rgba(201,171,110,.45);
  --ivory:#f4efe6;
  --muted:#d6d0c4;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--letterbox);color:var(--ivory)}
body{font-family:var(--body);font-weight:300}
[hidden]{display:none!important}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--letterbox)}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:var(--navy);transform-origin:center center}

.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease-in-out;background:radial-gradient(ellipse 75% 70% at 50% 45%,var(--navy-2),var(--navy));pointer-events:none}
.slide.on{opacity:1}
.slide.off{visibility:hidden}

.frame{position:absolute;overflow:hidden;outline:1px solid var(--gold-soft);outline-offset:12px;background:#0a121b;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.bleed{outline:0;box-shadow:none}
.on .kb.in{animation:kbIn var(--dur) linear forwards}
.on .kb.out{animation:kbOut var(--dur) linear forwards}
.on .kb.pan{animation:kbPan var(--dur) linear forwards}
@keyframes kbIn{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes kbOut{from{transform:scale(1.07)}to{transform:scale(1)}}
@keyframes kbPan{from{transform:scale(1.06) translateX(-1.5%)}to{transform:scale(1.06) translateX(1.5%)}}

function runProgress(ms){ prog.classList.remove("run"); prog.style.transitionDuration="0ms"; prog.style.width="0"; void prog.offsetWidth; prog.classList.add("run"); prog.style.transitionDuration=ms+"ms"; prog.style.width="100%"; }
function prime(n){ // warm up the next video so it starts cleanly
  const v=els[(n+els.length)%els.length].querySelector("video"); if(v && v.preload!=="auto"){ v.preload="auto"; v.load(); }
}
function show(n){
  const prev=els[idx];
  idx=(n+SLIDES.length)%SLIDES.length;
  const s=SLIDES[idx], el=els[idx];
  clearTimeout(timer);
  if(prev && prev!==el){ prev.classList.remove("on"); const pv=prev.querySelector("video"); if(pv){ pv.muted=true; pv.pause(); pv.onended=null; } setTimeout(()=>{ if(!prev.classList.contains("on")){ prev.classList.add("off"); if(pv) pv.pause(); } },1700); }
  el.classList.remove("off","on"); void el.offsetWidth; el.classList.add("on");
  count.textContent=`${idx+1} / ${SLIDES.length}`;
  prime(idx+1); prime(idx+2);
  const v=el.querySelector("video");
  if(v){
    v.muted=!sound; try{ v.currentTime=0; }catch(e){}
    const go=()=>runProgress((v.duration||20)*1000);
    if(v.readyState>=1) go(); else v.onloadedmetadata=go;
    const p=v.play(); if(p) p.catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
    v.onended=()=>{ if(!paused) show(idx+1); };
    v.onerror=()=>{ if(!paused) timer=setTimeout(()=>show(idx+1),3000); };
  } else {
    runProgress(s.dur);
    if(!paused) timer=setTimeout(()=>show(idx+1), s.dur);
  }
}
function setPaused(p){
  paused=p; document.getElementById("bPlay").textContent=p?"Play":"Pause";
  const v=els[idx]&&els[idx].querySelector("video");
  document.querySelectorAll(".kb,.rv").forEach(k=>k.style.animationPlayState=p?"paused":"");
  if(p){ clearTimeout(timer); if(v) v.pause(); const w=getComputedStyle(prog).width; prog.classList.remove("run"); prog.style.width=w; }
  else { if(v) v.play().catch(()=>{}); else { runProgress(4000); timer=setTimeout(()=>show(idx+1),4000); } }
}
function setSound(on){ sound=on; const b=document.getElementById("bSound"); b.setAttribute("aria-pressed",String(on)); b.textContent=on?"Video sound on":"Video sound off"; const v=els[idx]&&els[idx].querySelector("video"); if(v) v.muted=!on; }
async function full(){ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} }
async function keepAwake(){ try{ await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&started) keepAwake(); });

// load every photo before starting, so nothing appears half-drawn on the night
const goBtn=document.getElementById("go"); const allImgs=[...stage.querySelectorAll("img")]; let ready=0;
goBtn.disabled=true; goBtn.textContent=`Preparing photos 0 / ${allImgs.length}`;
allImgs.forEach(im=>{ const done=()=>{ ready++; goBtn.textContent = ready<allImgs.length ? `Preparing photos ${ready} / ${allImgs.length}` : "Start slideshow"; if(ready>=allImgs.length) goBtn.disabled=false; };
  (im.complete ? Promise.resolve() : new Promise(r=>{ im.onload=r; im.onerror=r; })).then(()=>im.decode?im.decode().catch(()=>{}):null).then(done); });
setTimeout(()=>{ goBtn.disabled=false; goBtn.textContent="Start slideshow"; }, 60000);
document.getElementById("go").onclick=()=>{ started=true; document.getElementById("start").hidden=true; full(); keepAwake(); show(0); };
document.getElementById("bPrev").onclick=()=>show(idx-1);
document.getElementById("bNext").onclick=()=>show(idx+1);
document.getElementById("bPlay").onclick=()=>setPaused(!paused);
document.getElementById("bFull").onclick=full;
document.addEventListener("keydown",e=>{
  if(!started) return;
  if(e.key===" "){ e.preventDefault(); setPaused(!paused); }
  else if(e.key==="ArrowRight") show(idx+1);
  else if(e.key==="ArrowLeft") show(idx-1);
  else if(e.key.toLowerCase()==="f") full();
});
const bar=document.getElementById("bar"); let idleT;
function wakeUi(){ if(!started) return; bar.classList.add("show"); document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>{ bar.classList.remove("show"); document.body.classList.add("idle"); },2500); }
["mousemove","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,wakeUi,{passive:true}));

els[0].classList.remove("off"); els[0].classList.add("on"); idx=0;
</script>
