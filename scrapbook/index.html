<style>
/* Layout: fixed 1920x1080 stage on black, letterboxed to any screen.
   Scenes: "pile" (tilted prints dropped on black with a handwritten title, then a dive into one print),
   "full" (photo fills the screen, pushed in), "print" (one or two large tilted prints dropped on black). */
:root{
  --black:#070707;
  --frame:#232323;
  --ink:#f6f2ea;
  --soft:#cfc8bb;
  --warm:#e7c98f;
  --script:"Ms Madi","Allura","Brush Script MT",cursive;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink)}
body{font-family:var(--sans);font-weight:300}
[hidden]{display:none!important}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:var(--black);transform-origin:center}

.layer{position:absolute;inset:0;background:var(--black);overflow:hidden;display:none}
.layer.vis{display:block}
.layer::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);z-index:20}

.print{position:absolute;background:var(--frame);padding:16px;box-shadow:0 24px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);transform-origin:center}
.print img{display:block;width:100%;height:100%;object-fit:cover}

.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.shade{position:absolute;left:0;right:0;bottom:0;height:460px;background:linear-gradient(to top,rgba(0,0,0,.82),transparent);z-index:5}

.script{font-family:var(--script);font-weight:400;line-height:1;color:var(--ink);text-shadow:0 4px 30px rgba(0,0,0,.6);white-space:nowrap}
.write{clip-path:inset(-30% 100% -30% -8%)}
.small{font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.32em;color:var(--warm)}
.txt{position:absolute;z-index:10;display:flex;flex-direction:column;gap:22px}

/* start screen and controls */

body.idle{cursor:none}

const W=1920,H=1080, stage=document.getElementById("stage");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease="cubic-bezier(.65,0,.35,1)", out="cubic-bezier(.2,.8,.2,1)";
// slots for prints in a pile: right two-thirds of the screen
const SLOTS=[{x:1290,y:540,r:-5,h:580},{x:1580,y:390,r:7,h:500},{x:1160,y:330,r:-8,h:440},{x:1560,y:770,r:4,h:440},{x:1190,y:820,r:-3,h:400}];

function printEl(it,cx,cy,h,r){
  const ar=it.w/it.h; let ih=h, iw=h*ar; if(iw>h*1.45){ iw=h*1.45; ih=iw/ar; }
  const d=document.createElement("div"); d.className="print";
  d.style.cssText=`left:${cx-iw/2-16}px;top:${cy-ih/2-16}px;width:${iw}px;height:${ih}px`;
  d.innerHTML=`<img src="${it.src}" alt="">`;
  d._r=r; d._box={cx,cy,iw,ih};
  return d;
}
function writeText(el,delay,dur){ return el.animate([{clipPath:"inset(-30% 100% -30% -8%)"},{clipPath:"inset(-30% -20% -30% -8%)"}],{duration:dur||1800,delay:delay||0,easing:"linear",fill:"forwards"}); }
function fadeUp(el,delay){ return el.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:900,delay,easing:out,fill:"both"}); }

function build(sc){
  const L=document.createElement("section"); L.className="layer "+sc.kind;
  if(sc.kind==="pile"){
    sc.prints.forEach((it,i)=>{ const s=SLOTS[i]; const p=printEl(it,s.x,s.y,s.h,s.r); p.style.zIndex= it.zoom?9:i+1; L.appendChild(p); });
    const t=document.createElement("div"); t.className="txt"; t.style.cssText=`left:110px;top:0;bottom:0;width:700px;justify-content:center`;
    t.innerHTML=`<div class="script write" style="font-size:${sc.big?200:160}px;white-space:normal;line-height:.95">${sc.title}</div>`+(sc.sub?`<div class="small" style="font-size:26px">${sc.sub}</div>`:"")+(sc.sub2?`<div class="small" style="font-size:22px;color:var(--soft)">${sc.sub2}</div>`:"");
    L.appendChild(t);
  } else if(sc.kind==="msg"){
    const t=document.createElement("div"); t.className="txt"; t.style.cssText="left:0;right:0;top:0;bottom:0;align-items:center;justify-content:center;gap:70px;text-align:center";
    t.innerHTML=sc.lines.map(l=>`<div class="script write" style="font-size:108px;white-space:normal;line-height:1.1">${l}</div>`).join("");
    L.appendChild(t);
  } else if(sc.kind==="full"){
    L.innerHTML=`<img src="${sc.src}" alt="">`+(sc.cap?`<div class="shade"></div><div class="txt" style="left:110px;bottom:90px"><div class="script write" style="font-size:124px">${sc.cap}</div></div>`:"");
  } else { // print
    const n=sc.items.length, capW=sc.cap?560:0;
    const cx0 = sc.cap ? 1240 : 960;
    if(n===1){ const it=sc.items[0]; const ar=it.w/it.h; const h= ar>1 ? 760 : 880; L.appendChild(printEl(it,cx0,540,h,sc.r||-3)); }
    else { const [a,b]=sc.items; const h=780; const wa=h*a.w/a.h, wb=h*b.w/b.h, gap=-60, tot=wa+wb+gap; let x=cx0-tot/2;
      const pa=printEl(a,x+wa/2,520,h,-5); const pb=printEl(b,x+wa+gap+wb/2,570,h,5); pb.style.zIndex=2; L.appendChild(pa); L.appendChild(pb); }
    if(sc.cap){ const t=document.createElement("div"); t.className="txt"; t.style.cssText=`left:110px;top:440px;width:${capW}px`; t.innerHTML=`<div class="script write" style="font-size:104px;white-space:normal">${sc.cap}</div>`; L.appendChild(t); }
  }
  stage.appendChild(L); return L;
}
const layers=SCENES.map(build);

let idx=-1, timer=null, paused=false, started=false, anims=[];
const track=a=>{ anims.push(a); return a; };

function play(i){
  const sc=SCENES[i], L=layers[i];
  anims.forEach(a=>{ try{a.finish()}catch(e){} }); anims=[];
  L.querySelectorAll(".write").forEach(w=>w.style.clipPath="");
  let dur=sc.dur;
  if(sc.kind==="pile"){
    const ps=[...L.querySelectorAll(".print")];
    ps.forEach((p,k)=>{
      p.style.transform=`rotate(${p._r}deg)`;
      track(p.animate([{opacity:0,transform:`translate(${k%2?420:-160}px,${-700}px) rotate(${p._r+(k%2?18:-18)}deg) scale(1.15)`},{opacity:1,transform:`rotate(${p._r}deg)`}],{duration:reduce?1:1100,delay:250+k*420,easing:out,fill:"both"}));
    });
    const t=L.querySelector(".script"); track(writeText(t,600+ps.length*300,2000));
    L.querySelectorAll(".small").forEach((s,k)=>track(fadeUp(s,1800+ps.length*300+k*300)));

    }

    L.querySelectorAll(".write").forEach((w,k)=>track(writeText(w,500+k*3200,2800)));
  } else if(sc.kind==="full"){
    const img=L.querySelector("img"); track(img.animate([{transform:"scale(1.0)"},{transform:`scale(1.08) translate(${sc.pan||0}%,0)`}],{duration:dur+1200,easing:"linear",fill:"forwards"}));

    const t=L.querySelector(".script"); if(t) track(writeText(t,900,1700));
  }

function transition(prev,next,how){
  if(!prev||prev===next){ next.classList.add("vis"); next.style.zIndex=2; return; }
  next.classList.add("vis"); prev.style.zIndex=1; next.style.zIndex=2;
  const done=()=>{ if(prev!==layers[idx]) prev.classList.remove("vis"); prev.style.transform=""; prev.style.opacity=""; };
  const D=reduce?1:1000;
  if(how==="cut"){ done(); return; }
  if(how==="push"||how==="pushUp"){
    const dx=how==="push"?W:0, dy=how==="pushUp"?H:0;
    next.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:D,easing:ease});
    prev.animate([{transform:"none"},{transform:`translate(${-dx}px,${-dy}px)`}],{duration:D,easing:ease}).onfinish=done;
  } else if(how==="drop"){ // new scene lands on top; old one sinks back and darkens
    next.animate([{opacity:0},{opacity:1}],{duration:500,easing:"ease-out"});
    prev.animate([{transform:"none",opacity:1},{transform:"scale(.92)",opacity:0}],{duration:900,easing:ease}).onfinish=done;
  } else { next.animate([{opacity:0},{opacity:1}],{duration:1400}).onfinish=done; }
}

function show(n){
  const prev=layers[idx];
  idx=(n+SCENES.length)%SCENES.length;
  clearTimeout(timer);
  const sc=SCENES[idx];
  const how = (n!==idx || !prev) ? (sc.enter||"fade") : sc.enter; // looping back to start fades
  transition(prev, layers[idx], idx===0 ? "fade" : (sc.enter||"fade"));
  const dur=play(idx);
  document.getElementById("count").textContent=`${idx+1} / ${SCENES.length}`;
  if(!paused) timer=setTimeout(()=>show(idx+1), dur);
}
function setPaused(p){
  paused=p; document.getElementById("bPlay").textContent=p?"Play":"Pause";
  if(p){ clearTimeout(timer); anims.forEach(a=>{try{a.pause()}catch(e){}}); }
  else { anims.forEach(a=>{try{a.play()}catch(e){}}); timer=setTimeout(()=>show(idx+1),3000); }
}
function fit(){ const k=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`scale(${k})`; stage.style.margin=`${(H*k-H)/2}px ${(W*k-W)/2}px`; }
addEventListener("resize",fit); fit();
async function full(){ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} }
async function keepAwake(){ try{ await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&started) keepAwake(); });

const go=document.getElementById("go"), imgs=[...stage.querySelectorAll("img")]; let ready=0;
go.disabled=true; go.textContent=`Preparing photos 0 / ${imgs.length}`;
imgs.forEach(im=>{ (im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;})).then(()=>im.decode?im.decode().catch(()=>{}):null).then(()=>{ ready++; go.textContent= ready<imgs.length?`Preparing photos ${ready} / ${imgs.length}`:"Start slideshow"; if(ready>=imgs.length) go.disabled=false; }); });
setTimeout(()=>{ go.disabled=false; go.textContent="Start slideshow"; },60000);
go.onclick=()=>{ started=true; document.getElementById("start").hidden=true; full(); keepAwake(); idx=-1; layers[0].classList.remove("vis"); show(0); };
document.getElementById("bPrev").onclick=()=>show(idx-1);
document.getElementById("bNext").onclick=()=>show(idx+1);
document.getElementById("bPlay").onclick=()=>setPaused(!paused);
document.getElementById("bFull").onclick=full;
document.addEventListener("keydown",e=>{ if(!started) return;
  if(e.key===" "){e.preventDefault();setPaused(!paused);} else if(e.key==="ArrowRight") show(idx+1); else if(e.key==="ArrowLeft") show(idx-1); else if(e.key.toLowerCase()==="f") full(); });
const bar=document.getElementById("bar"); let idleT;
function wakeUi(){ if(!started) return; bar.classList.add("show"); document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>{bar.classList.remove("show");document.body.classList.add("idle");},2500); }
["mousemove","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,wakeUi,{passive:true}));

// opening pile visible, at rest, behind the start screen
(()=>{ const L=layers[0]; L.classList.add("vis"); L.querySelectorAll(".print").forEach(p=>p.style.transform=`rotate(${p._r}deg)`); L.querySelectorAll(".write").forEach(w=>w.style.clipPath="none"); })();
</script>
