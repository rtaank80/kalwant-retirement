<style>
/* Layout: fixed 1920x1080 page on sage gingham, letterboxed to any screen. Each page is pre-composed:
   bold sage headline, white-bordered prints, handwritten notes and hand-drawn line icons. */
:root{
  --cloth:#e8ede5;
  --check:rgba(140,160,135,.12);
  --sage:#8b9078;
  --sage-ink:#7d8269;
  --paper:#fbfaf6;
  --head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --script:"Sacramento","Brush Script MT",cursive;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#d9dfd5;color:var(--sage)}
body{font-family:var(--head)}
[hidden]{display:none!important}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#d9dfd5}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;transform-origin:center;
  background-color:var(--cloth);
  background-image:var(--grain),
    repeating-linear-gradient(90deg,var(--check) 0 24px,transparent 24px 48px),
    repeating-linear-gradient(0deg,var(--check) 0 24px,transparent 24px 48px);}
.page{position:absolute;inset:0;display:none}
.page.vis{display:block}

.h{position:absolute;margin:0;font-family:var(--head);font-weight:800;color:var(--sage);letter-spacing:-.035em;line-height:.95;text-wrap:balance}
.s{position:absolute;font-family:var(--script);color:var(--sage-ink);line-height:1.15;white-space:nowrap;-webkit-text-stroke:.9px currentColor}
.s.wrap{white-space:normal}
.write{clip-path:inset(-40% 100% -40% -6%)}
.print{position:absolute;background:var(--paper);padding:14px;box-shadow:0 14px 30px rgba(70,80,60,.22),0 2px 5px rgba(70,80,60,.18);transform-origin:center}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print.bw img{filter:grayscale(1) contrast(1.05)}
.icon{position:absolute;fill:none;stroke:var(--sage);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(232,237,229,.94);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#start h1{margin:0;font-family:var(--head);font-weight:800;letter-spacing:-.03em;color:var(--sage);font-size:clamp(40px,6vw,104px);line-height:1}
#start p{margin:0 0 12px;font-family:var(--script);color:#6f745c;font-size:clamp(38px,5vw,92px);line-height:1.1;-webkit-text-stroke:1.2px currentColor}
button{font:inherit;cursor:pointer;border:0}
#go{background:var(--sage);color:#fff;font-family:var(--head);font-weight:700;letter-spacing:.04em;border-radius:999px;padding:14px 34px;font-size:clamp(15px,1.2vw,20px)}
#go:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--sage-ink);outline-offset:3px}
#bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:29;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;opacity:0;transition:opacity .4s;max-width:calc(100vw - 32px)}
#bar.show{opacity:1}
#bar button,#count{background:rgba(251,250,246,.92);color:var(--sage-ink);border:1px solid rgba(125,130,105,.35);border-radius:999px;padding:8px 16px;font-size:14px;font-family:var(--head);font-weight:700}
#count{font-variant-numeric:tabular-nums}
body.idle{cursor:none}
</style>
</head>

  <button id="bNext" type="button">Next</button>
  <button id="bFull" type="button">Full screen</button>
  <span id="count"></span>
</div>

=\"16\"/><ellipse cx=\"64\" cy=\"28\" rx=\"13\" ry=\"16\"/><path d=\"M37 50 C34 62 44 72 50 86\"/><path d=\"M64 44 C66 58 56 72 50 86\"/><path d=\"M35 50 L39 50 M62 44 L66 44\"/>"};
const W=1920,H=1080, stage=document.getElementById("stage");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const out="cubic-bezier(.2,.8,.2,1)";

// soft linen grain, drawn once
(()=>{ const c=document.createElement("canvas"); c.width=c.height=240; const x=c.getContext("2d"); const d=x.createImageData(240,240);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=14; }
  x.putImageData(d,0,0); stage.style.setProperty("--grain",`url(${c.toDataURL()})`); })();

function build(p){
  const L=document.createElement("section"); L.className="page";
  for(const e of p.els){
    let n;
    if(e.t==="h"){ n=document.createElement("h2"); n.className="h"; n.innerHTML=e.text; }
    else if(e.t==="s"){ n=document.createElement("div"); n.className="s write"+(e.wrap?" wrap":""); n.innerHTML=e.text; }
    else if(e.t==="p"){ n=document.createElement("div"); n.className="print"+(e.bw?" bw":""); n.innerHTML=`<img src="${e.src}" alt="">`; }
    else if(e.t==="i"){ n=document.createElementNS("http://www.w3.org/2000/svg","svg"); n.setAttribute("class","icon"); n.setAttribute("viewBox","0 0 100 100"); n.innerHTML=ICONS[e.name]; }
    const st=n.style; st.left=e.x+"px"; st.top=e.y+"px"; if(e.w) st.width=e.w+"px"; if(e.hh) st.height=e.hh+"px";
    if(e.fs) st.fontSize=e.fs+"px"; if(e.align) st.textAlign=e.align;
    n._r=e.r||0; st.transform=`rotate(${n._r}deg)`; n._e=e;
    L.appendChild(n);
  }
  stage.appendChild(L); return L;
}
const pages=PAGES.map(build);

let idx=-1,timer=null,paused=false,started=false,anims=[];
const T=a=>{anims.push(a);return a;};
function animate(L,dur){
  anims.forEach(a=>{try{a.finish()}catch(e){}}); anims=[];
  if(reduce) { L.querySelectorAll(".write").forEach(w=>w.style.clipPath="none"); return; }
  let k=0;
  L.querySelectorAll(".h").forEach(h=>T(h.animate([{opacity:0,transform:"translateY(24px)"},{opacity:1,transform:"none"}],{duration:1000,delay:200,easing:out,fill:"both"})));
  const prints=[...L.querySelectorAll(".print")];
  prints.forEach((p,i)=>{ const r=p._r;
    T(p.animate([{opacity:0,transform:`translateY(-40px) rotate(${r+(i%2?6:-6)}deg) scale(1.06)`},{opacity:1,transform:`rotate(${r}deg) scale(1)`,offset:.16},{opacity:1,transform:`rotate(${r*0.85}deg) scale(1.025)`}],{duration:dur+1200,delay:450+i*260,easing:"ease-out",fill:"both"})); });
  const base=700+prints.length*260;
  L.querySelectorAll(".icon").forEach((ic,i)=>{ ic.querySelectorAll("path,circle,line,polyline,rect,ellipse").forEach(sh=>{ let len=300; try{ len=sh.getTotalLength(); }catch(e){}
      sh.style.strokeDasharray=len; T(sh.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:1600,delay:base+i*350,easing:"ease-in-out",fill:"both"})); }); });
  L.querySelectorAll(".write").forEach((w,i)=>{ w.style.clipPath=""; T(w.animate([{clipPath:"inset(-40% 100% -40% -6%)"},{clipPath:"inset(-40% -10% -40% -6%)"}],{duration:1400,delay:base+300+i*380,easing:"linear",fill:"forwards"})); });
}
function show(n){
  const prev=pages[idx]; idx=(n+PAGES.length)%PAGES.length; const L=pages[idx], dur=PAGES[idx].dur;
  clearTimeout(timer);
  if(prev&&prev!==L){ prev.style.zIndex=1; prev.animate([{opacity:1},{opacity:0}],{duration:reduce?1:900,easing:"ease-in-out"}).onfinish=()=>{ if(prev!==pages[idx]) prev.classList.remove("vis"); }; }
  L.style.zIndex=2; L.classList.add("vis");
  animate(L,dur);
  document.getElementById("count").textContent=`${idx+1} / ${PAGES.length}`;
  if(!paused) timer=setTimeout(()=>show(idx+1),dur);
}
function setPaused(p){ paused=p; document.getElementById("bPlay").textContent=p?"Play":"Pause";
  if(p){ clearTimeout(timer); anims.forEach(a=>{try{a.pause()}catch(e){}}); } else { anims.forEach(a=>{try{a.play()}catch(e){}}); timer=setTimeout(()=>show(idx+1),3000); } }
function fit(){ const k=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`scale(${k})`; stage.style.margin=`${(H*k-H)/2}px ${(W*k-W)/2}px`; }
addEventListener("resize",fit); fit();
async function full(){ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} }
async function keepAwake(){ try{ await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&started) keepAwake(); });

const go=document.getElementById("go"), imgs=[...stage.querySelectorAll("img")]; let ready=0;
go.disabled=true; go.textContent=`Preparing photos 0 / ${imgs.length}`;
imgs.forEach(im=>{ (im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;})).then(()=>im.decode?im.decode().catch(()=>{}):null).then(()=>{ ready++; go.textContent=ready<imgs.length?`Preparing photos ${ready} / ${imgs.length}`:"Start slideshow"; if(ready>=imgs.length) go.disabled=false; }); });
setTimeout(()=>{ go.disabled=false; go.textContent="Start slideshow"; },60000);
go.onclick=()=>{ started=true; document.getElementById("start").hidden=true; full(); keepAwake(); pages[0].classList.remove("vis"); idx=-1; show(0); };
document.getElementById("bPrev").onclick=()=>show(idx-1);
document.getElementById("bNext").onclick=()=>show(idx+1);
document.getElementById("bPlay").onclick=()=>setPaused(!paused);
document.getElementById("bFull").onclick=full;
document.addEventListener("keydown",e=>{ if(!started) return;
  if(e.key===" "){e.preventDefault();setPaused(!paused);} else if(e.key==="ArrowRight") show(idx+1); else if(e.key==="ArrowLeft") show(idx-1); else if(e.key.toLowerCase()==="f") full(); });
const bar=document.getElementById("bar"); let idleT;
function wakeUi(){ if(!started) return; bar.classList.add("show"); document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>{bar.classList.remove("show");document.body.classList.add("idle");},2500); }
["mousemove","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,wakeUi,{passive:true}));
// first page complete at rest behind the start screen
pages[0].classList.add("vis"); pages[0].querySelectorAll(".write").forEach(w=>w.style.clipPath="none");
</script>
